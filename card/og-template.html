<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;overflow:hidden;
       font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',sans-serif;color:#131d2e;
       background:linear-gradient(158deg,#f4f6f9 0%,#e9edf3 100%);position:relative}
  .glow{position:absolute;left:-160px;top:-200px;width:760px;height:760px;border-radius:50%;
        background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 68%)}
  .in{position:relative;height:100%;display:flex;align-items:center;gap:56px;padding:0 64px}
  .left{flex:1;min-width:0}
  .br-logo{display:block;width:auto;height:30px;--br-blk:transparent;--br-let:#1b2a44;--br-gold:#C5A47E;overflow:visible}
  .name{font-size:76px;font-weight:800;letter-spacing:-.045em;line-height:1.05;margin-top:30px;color:#0f1a2c}
  .role{font-size:23px;font-weight:650;letter-spacing:-.02em;color:#2c3a51;margin-top:16px}
  .role i{font-style:normal;color:#9aa4b4;font-weight:400;margin:0 8px}
  .co{font-size:18px;color:#5d6879;margin-top:8px;letter-spacing:-.01em}
  .contact{margin-top:34px;display:flex;align-items:center;gap:16px;font-size:15px;color:#4f5b6d;letter-spacing:-.01em}
  .contact b{font-weight:750;color:#14203a;font-size:26px;letter-spacing:-.02em}
  .contact .d{width:1px;height:18px;background:#c9d0db}
  .contact2{margin-top:12px;font-size:16px;color:#4f5b6d;letter-spacing:-.005em}
  .foot{position:absolute;left:64px;bottom:44px;display:flex;align-items:center;gap:12px;font-size:14px;color:#7b8491}
  .foot .gold{width:22px;height:1px;background:rgba(197,164,126,.9)}

  .right{flex:none;position:relative;width:396px;height:510px;border-radius:22px;overflow:hidden;
         background:#8e8c8a;
         box-shadow:0 30px 60px rgba(11,25,51,.28),0 0 0 1px rgba(11,25,51,.06)}
  .right img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 0}
</style>
</head>
<body>
  <svg id="sprite" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">__LOGO__</svg>
  <div class="glow"></div>
  <div class="in">
    <div class="left">
      <svg class="br-logo" viewBox="0 0 237.33 62.74" role="img" aria-label="벨라리치 BellaRich"><use href="#brLogo"/></svg>
      <h1 class="name">김자영</h1>
      <p class="role">법인 자산관리 · 부동산 전문가<i>|</i>CFP · 공인중개사</p>
      <p class="co">벨라리치(주) 대표</p>
      <div class="contact"><b>010-5031-0789</b><span class="d"></span><span>bellarich.co.kr/card</span></div>
      <p class="contact2">bellarich7@naver.com</p>
    </div>
    <div class="right">
      <img id="ceo" alt="김자영 대표" />
    </div>
  </div>
  <div class="foot"><span class="gold"></span><span>벨라리치(주) · 법인 자산관리 컨설팅</span></div>
</body>
</html>
