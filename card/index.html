<style>
:root{
  --navy:#0B1933;
  --ink:#131d2e;
  --sub:#5a6474;
  --label:#57616f;
  --label2:#646e7d;
  --mute:#7d8694;
  --line:#eef0f4;
  --soft:#f4f5f7;
  --gold:#C5A47E;
  --stage-1:#b7c3d8;
  --stage-2:#cdd7e6;
  --stage-3:#dde4ee;
  --sans:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:#8a8788;
  font-family:var(--sans);font-weight:400;color:var(--ink);
  letter-spacing:-.012em;word-break:keep-all;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
ul{list-style:none;margin:0;padding:0}
h1,h2,p{margin:0}
:focus-visible{outline:2px solid #7d8ea8;outline-offset:2px;border-radius:8px}

/* ---------- page frame ---------- */
.page{
  min-height:100vh;min-height:100dvh;
  display:flex;justify-content:center;align-items:flex-start;
  /* 스튜디오 배경과 같은 회색 — assets/card-hero.json 의 가장자리 실측값 */
  background:linear-gradient(180deg,#888688 0%,#8a8788 46%,#7c7c7e 100%);
}
.card{
  width:100%;max-width:430px;background:#fff;
  display:flex;flex-direction:column;position:relative;
  overflow:hidden;
}

/* ---------- hero ---------- */
.hero{position:relative}
/* 사진 캔버스 비율 그대로 — 크롭 없음. 좌우는 사진 가장자리 회색을 그대로 이어 붙인 부분 */
.hero__stage{
  position:relative;overflow:hidden;
  aspect-ratio:1645 / 1388;
  background:#8a8788;
}
.hero__photo{
  position:absolute;inset:0;
  pointer-events:none;user-select:none;
}
.hero__photo img{
  display:block;width:100%;height:100%;
  object-fit:cover;object-position:50% 50%;
}

/* translucent identity box, attached to the bottom edge of the hero */
.idbox{
  position:relative;margin:-22px 12px 0;
  padding:11px 14px 11px;
  background:rgba(255,255,255,.92);
  -webkit-backdrop-filter:blur(14px) saturate(1.15);
  backdrop-filter:blur(14px) saturate(1.15);
  border:1px solid rgba(255,255,255,.82);
  border-radius:14px;
  box-shadow:0 12px 30px rgba(4,10,22,.26),0 1px 0 rgba(255,255,255,.9) inset;
}
.idbox__top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.idbox__name{
  font-size:18.5px;line-height:1.15;font-weight:800;letter-spacing:-.035em;color:#111c2e;
}
.br-sprite{position:absolute;width:0;height:0;overflow:hidden}
.br-logo{
  display:block;height:20px;width:auto;flex:none;overflow:visible;
  /* 블록·스카이라인은 남색, 'Bella' 글자는 크림 녹아웃, 'Rich'는 골드 */
  --br-blk:#16233d;--br-let:#F6F2EA;--br-gold:#C5A47E;
}
.idbox__role{
  margin-top:5px;font-size:13.5px;line-height:1.45;font-weight:500;color:#3a4558;
  letter-spacing:-.014em;
}
.idbox__role b{font-weight:700;color:#141f31}
.idbox__role .bar{color:#aeb6c4;margin:0 4px;font-weight:400}
.idbox__co{margin-top:2px;font-size:12.5px;line-height:1.45;color:#4e5866;letter-spacing:-.014em}

/* ---------- contact rows (main block of the card) ---------- */
.info{background:#fff;padding:6px 0 4px}
.info__row{
  display:flex;align-items:center;gap:12px;
  min-height:70px;padding:15px 18px;
  border-bottom:1px solid var(--line);
  transition:background .16s ease;
}
.info__row:last-child{border-bottom:0}
.info__row:hover,.info__row:focus-visible{background:#fafbfc}
.info__row:active{background:#f5f7fa}
.info__k{
  flex:none;width:72px;font-size:13.5px;line-height:1.4;font-weight:700;color:#3d4757;
  letter-spacing:-.015em;
}
.info__v{
  flex:1;min-width:0;text-align:right;
  font-size:16.5px;font-weight:700;letter-spacing:-.03em;color:#0e1826;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.info__v--addr{font-size:14px;font-weight:700;letter-spacing:-.035em;line-height:1.4;white-space:normal}
.info__nb{white-space:nowrap}
.info__ar{flex:none;color:#a9b1be;display:flex}
.info__ar svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* thick gray bar between the card body and the intro block */
.rule{height:10px;background:var(--soft)}

/* ---------- intro + links ---------- */
.more{background:#fff;padding:0 0 2px}
.links{display:flex;flex-direction:column}
.lk{
  display:flex;align-items:center;gap:12px;
  min-height:54px;padding:4px 18px;
  border-top:1px solid var(--line);
  transition:background .16s ease;
}
.lk:hover,.lk:focus-visible{background:#fafbfc}
.lk:active{background:#f5f7fa}
.lk__ic{
  flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  background:#f1f3f8;color:#3a4a63;
}
.lk__ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lk__tx{flex:1;min-width:0;display:flex;align-items:center}
.lk__t{display:block;width:100%;font-size:14px;font-weight:600;letter-spacing:-.022em;line-height:1.35;color:#4c5665}
.lk__ar{flex:none;color:#c8cdd6;display:flex}
.lk__ar svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lk--kakao .lk__ic{background:#FEE500;color:#231F20}
.lk--kakao .lk__ic svg{stroke:none}
.lk--check .lk__ic{background:#16233d;color:#fff}
.lk--check .lk__ic svg{stroke:currentColor}
.lk--home .lk__ic{background:#16233d;color:#fff}
.lk--home .lk__ic svg{stroke:currentColor}
.lk--talk .lk__ic{background:#C5A47E;color:#1b1408}

/* ---------- sns icon row ---------- */
.sns{display:flex;gap:7px;padding:6px 18px 7px;border-top:1px solid var(--line)}
.sns__a{
  flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;
  height:44px;border-radius:10px;background:#fff;border:1px solid #e3e7ee;
  font-size:11.5px;font-weight:600;letter-spacing:-.02em;color:#4a5567;
  transition:background .16s ease,border-color .16s ease;
}
.sns__a:hover,.sns__a:focus-visible{background:#fafbfd;border-color:#d2d8e2}
.sns__a:active{background:#f3f5f9}
.sns__i{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff}
.sns__i svg{width:12.5px;height:12.5px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sns__i--yt{background:#FF0000}
.sns__i--ig{background:radial-gradient(circle at 28% 108%,#fdf497 0%,#fd5949 46%,#d6249f 62%,#285AEB 92%)}
.sns__i--nb{background:#03C75A}

/* ---------- actions ---------- */
.acts{display:flex;gap:8px;padding:10px 18px 2px}
.btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  height:44px;border-radius:11px;font-size:12.5px;font-weight:650;letter-spacing:-.02em;
  transition:transform .16s ease,filter .16s ease,background .16s ease,border-color .16s ease;
}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn:active{transform:scale(.985)}
.btn--solid{background:var(--navy);color:#fff}
.btn--solid:hover{filter:brightness(1.12)}
.btn--ghost{background:#fff;border:1px solid #dfe3ea;color:#2a3446}
.btn--ghost:hover{border-color:#c5ccd8;background:#fafbfc}

/* ---------- footer ---------- */
.foot{padding:14px 22px 26px;text-align:center;background:#fff}
.foot__co{font-size:11px;font-weight:600;color:#525c6b;letter-spacing:-.01em}
.foot__co span{font-weight:400;color:#6b7482}
.foot__ad{font-size:10.5px;line-height:1.7;color:#6b7482;margin-top:4px}
.foot__ct{font-size:10.5px;line-height:1.7;color:#6b7482}
.foot__ct a{border-bottom:1px solid #cfd5de}
.foot__cp{font-size:9.5px;letter-spacing:.1em;color:#8a94a1;margin-top:10px;text-transform:uppercase}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
  max-width:calc(100% - 40px);padding:11px 18px;border-radius:999px;
  background:rgba(15,24,40,.94);
  color:#fff;font-size:12.5px;letter-spacing:-.01em;text-align:center;
  box-shadow:0 14px 34px rgba(10,18,32,.3);
  opacity:0;pointer-events:none;transition:opacity .24s ease,transform .24s ease;z-index:50;
}
.toast.is-on{opacity:1;transform:translate(-50%,0)}

/* ---------- desktop ---------- */
@media (min-width:760px){
  .page{padding:44px 0 56px}
  .card{
    border-radius:22px;
    box-shadow:0 26px 60px rgba(24,38,62,.16),0 2px 8px rgba(24,38,62,.06),0 0 0 1px rgba(24,38,62,.04);
  }
  .idbox{margin:-24px 14px 0;padding:12px 16px}
  .idbox__name{font-size:19.5px}
  .br-logo{height:21px}
  .info__row{padding:16px 22px;min-height:72px}
  .info__k{width:78px;font-size:14px}
  .info__v{font-size:17px}
  .info__v--addr{font-size:14.5px}
  .lk{min-height:56px;padding:4px 22px;gap:12px}
  .lk__t{font-size:14.5px}
  .lk__ic{width:33px;height:33px;border-radius:10px}
  .lk__ic svg{width:16.5px;height:16.5px}
  .acts{padding:10px 22px 2px}
  .foot{padding-bottom:28px}
}
@media (max-width:360px){
  .info__k{width:66px;font-size:13px;letter-spacing:-.02em}
  .info__v{font-size:15.5px}
  .info__v--addr{font-size:13.5px}
  .lk__t{font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>

<script>
(function () {
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function toast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('is-on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('is-on'); }, 2400);
  }

  var CARD_URL = 'https://bellarich.co.kr/card/';
  var VCARD = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    'N:김자영;;;;',
    'FN:김자영',
    'ORG:벨라리치(주)',
    'TITLE:대표',
    'TEL;TYPE=CELL:+82-10-5031-0789',
    'EMAIL;TYPE=WORK:bellarich7@naver.com',
    'URL:https://bellarich.co.kr',
    'ADR;TYPE=WORK:;;서울 서대문구 이화여대1길 38, 201-51호 (대현동, 다올노블리움);서울특별시;;',
    'END:VCARD',
    ''
  ].join('\r\n');

  var saveBtn = document.getElementById('saveCard');
  if (saveBtn) {
    saveBtn.addEventListener('click', function () {
      try {
        var blob = new Blob([VCARD], { type: 'text/vcard;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = '김자영-벨라리치.vcf';
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
        toast('연락처 파일을 내려받았어요');
      } catch (e) {
        window.open('data:text/vcard;charset=utf-8,' + encodeURIComponent(VCARD), '_blank');
      }
    });
  }

  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? '명함 주소를 복사했어요' : 'bellarich.co.kr/card');
  }

  function copyCardUrl() {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(CARD_URL).then(
        function () { toast('명함 주소를 복사했어요'); },
        function () { legacyCopy(CARD_URL); }
      );
    } else {
      legacyCopy(CARD_URL);
    }
  }

  var shareBtn = document.getElementById('shareCard');
  if (shareBtn) {
    shareBtn.addEventListener('click', function () {
      var data = {
        title: '김자영 대표 | 벨라리치(주)',
        text: '법인을 아는 부동산 전문가, 부동산을 아는 법인 전문가',
        url: CARD_URL
      };
      if (navigator.share) {
        navigator.share(data).then(function () {}, function (err) {
          if (err && err.name === 'AbortError') return;
          copyCardUrl();
        });
      } else {
        copyCardUrl();
      }
    });
  }
})();
</script>
